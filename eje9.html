<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Estaciones de año por mes
                let mes =parseInt(prompt("Escriba un número del uno al doce y escoja un mes"));

                switch(mes){
                case (1):
                alert("El mes escojido fue:Enero y es la estacion invierno");
                break;
                case(2):
                alert("El mes escojido fue:Febrero y es la estacion invierno");
                case(12):
                alert("El mes escojido fue:Diciembre y es la estacion invierno");
                break;
                alert("Níguno de los números escojidos corresponde a algun mes ")
                case (3):
                alert("El mes escojido fue:Marzo y es la estacion primavera");
                break;
                case 4:
                alert("El mes escojido fue:abril y es la estacion primavera");
                break;
                case 5:
                alert("El mes escojido fue:mayo y es la estacion primavera");
                break;
                case 6:
                alert("El mes escojido fue:Junio y es la estacion verano");
                break;
                case 7:
                alert("El mes escojido fue:Julio y es la estacion verano");
                break;
                case 8:
                alert("El mes escojido fue:Agosto y es la estacion verano");
                break;
                case 9:
                alert("El mes escojido fue:Septiembre y es la estacion otoño");
                break;
                case 10:
                alert("El mes escojido fue:Octubre y es la estacion otoño");
                break;
                case 11:
                alert("El mes escojido fue:Noviembre y es la estacion otoño");
                break;
                default:
                alert("Níguno de los números escojidos corresponde a algun mes ")
        }
    </script>
</body>
</html>
