<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num=parseInt(prompt("Escriba el número del que quiere ver la tabla de multiplicar:"));
        let multi =0;
        for(let i=0;i<11;i++){
            multi=num*i;
            alert(num+"X"+i+"="+multi);
        }
    </script>
</body>
</html>
