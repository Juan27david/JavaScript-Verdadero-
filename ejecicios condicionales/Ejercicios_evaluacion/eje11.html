<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let n = parseInt(prompt("Ingrese un número:"));
        let pares = 0;
        let impares = 0;

        while (n !== 0) {
            if (n % 2 === 0) {
                pares++;
            } else {
                impares++;
            }
            n = parseInt(prompt("Ingrese otro numero:"));
        }

        alert("Los numeros pares son: " + pares + " Y los impares son: " + impares);

    </script>
</body>

</html>
