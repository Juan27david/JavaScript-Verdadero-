<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //pedir 5 números y decir si es par o impar
        
        let n = 1 ;
        while(n<=5){
            let num = parseInt(prompt("Escriba un número"));
            if(num%2==0) {
                alert("El número "+num+" es par");
            }else {
            alert("El número "+num+ " es impar ");
            }
        n++
        }

        alert("Final");
    </script>
</body>
</html>
