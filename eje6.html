<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <script>
    let tipoc = prompt(":Escriba el tipo de vehiculo ").toUpperCase();
    switch (tipoc) {
        case "A":
            alert("El VEHICULO ES AUTOMOVIL")
            break;
        case "M":
            alert("El VEHICULO ES LA MOTOCICLETA")
            break;
        case "C":
            alert("El VEHICULO ES EL CAMION")
            break;
            case "B":
            alert("El VEHICULO ES la bicicleta")
            break;

        default:
            alert("El tipo de vehiculo no contiene ningun tipo ")
            alert("Escoja un tipo entre coche, moto y autobus ")
    }

  </script>
</body>
</html>
