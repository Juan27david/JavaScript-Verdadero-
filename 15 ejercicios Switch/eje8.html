<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //leer una letra y mostrar lacalificacion correspondiente
        let cal = prompt("Escriba la letra correspondiente a la calificacion :A=EXCELENTE,B=BUENO,C=ACEPTABLE,D=INSUFICIENTE").toUpperCase();
         switch (cal){

        case "A":
            alert("EXCELENTE")
            break;
        case "B":
            alert("BUENO")
            break;
        case "C":
            alert("ACEPTABLE")
            break;
        case "D":
            alert("INSUFICIENTE")
            break;

         }
    </script>
</body>
</html>
