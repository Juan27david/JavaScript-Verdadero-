<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let mes = parseInt(prompt("(:Escriba un numero de 1 a 12 :) : "));

        switch (mes) {
            case 1:
                alert("Enero")
                break;
            case 2:
                alert("Febrero")
                break;
            case 3:
                alert("Marzo")
                break;
            case 4:
                alert("Abril")
                break;
            case 5:
                alert("Mayo")
                break;
            case 6:
                alert("Junio")
                break;
            case 7:
                alert("Julio")
                break;
            case 8:
                alert("Agosto")
                break;
            case 9:
                alert("Septiembre")
                break;
            case 10:
                alert("Octubre")
                break;
            case 11:
                alert("Noviembre")
                break;
            case 12:
                alert("Diciembre")
                break;

            default:
                alert("El numero escojido no contiene ningun mes del año ")
                alert("Escoje un numero de 1 al 12 ")
        }




    </script>
</body>

</html>
