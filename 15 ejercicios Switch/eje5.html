<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let semaforo = prompt("Escriba un color del semaforo :").toLowerCase();
        switch (semaforo) {
            case "rojo":
                alert("Pare")
                break;
            case "amarillo":
                alert("Preparado")
                break;
            case "verde":
                alert("Siga")
                break;

            default:
                alert("El color escojido no contiene ningun color del semaforo ")
                alert("Escoja un color entre rojo, amarillo y verde ")
        }
    </script>

</body>
</html>
