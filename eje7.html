<body>
    <script>

        let num = parseInt(prompt("Escriba un numero de 1 a 4:"));
         switch (num) {
            case 1:
                alert("Primavera")
                break;

            case 2:
                alert("Verano")
                break;
            case 3:
                alert("Otoño")
                break;
            case 4:
                alert("Invierno")
                break;

                default:
                     alert("Escoja un numero de uno a cuatro")
                    alert("Escoja un numero de uno a cuatro")
         }

    </script>
</body>
