<body>
    <script>
        let n = parseInt(prompt("Ingrese un numero: "));
        let suma = 0;
        let contador = 0;
        while (n !== 0) {
            if (n % 10 == 3) {
                suma = suma + n;v 
                contador++;
            }
            n = parseInt(prompt("Ingrese un numero: "));
        }
        let promedio =Math.floor( suma / contador);
        alert("El promedio de los numeros que terminan en 3 es: " + promedio);
    </script>
</body>
