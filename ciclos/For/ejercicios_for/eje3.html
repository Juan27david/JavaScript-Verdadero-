<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let cant = parseInt(prompt("Escriba la cantidad de multiplos de 3 que quiera ver "));
        suma=0;
            for (let i = 1; i <=cant; i++) {
            suma+=i*3;
            }
            let prome = Math.abs(suma/cant);
            console.log("El promedio es:"+prome);    
          </script>
</body>
</html>
