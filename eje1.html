<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num = parseInt(prompt("Escriba un numero de 1 a 7 : "));

switch (num) {
    case 1:
        alert("Lunes")
        break;
    case 2:
        alert("Martes")
        break;
    case 3:
        alert("Miercoles")
        break;
    case 4:
        alert("Jueves")
        break;
    case 5:
        alert("Viernes")
        break;
    case 6:
        alert("Sabado")
        break;
    case 7:
        alert("Domingo")
        break;

    default:
        alert("El numero escojido no contiene ningun dia de la semana ")
        alert("Escoje un numero de 1 a 7 ")
}




    </script>
</body>
</html>
